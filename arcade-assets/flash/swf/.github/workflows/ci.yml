name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Route Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Production build (fails on bundle/route errors)
        run: bun run build

      - name: Verify build artifacts
        run: |
          set -e
          test -d dist/client || (echo "::error::dist/client missing"; exit 1)
          test -d dist/server || (echo "::error::dist/server missing"; exit 1)
          test -f dist/server/index.js || (echo "::error::dist/server/index.js missing"; exit 1)

      - name: Verify generated route tree
        run: |
          set -e
          test -f src/routeTree.gen.ts || (echo "::error::routeTree.gen.ts not generated"; exit 1)
          if grep -q "conflicting" src/routeTree.gen.ts; then
            echo "::error::Conflicting routes detected in routeTree.gen.ts"
            exit 1
          fi