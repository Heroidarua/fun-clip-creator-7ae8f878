[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  TARGET = "netlify"

[functions]
  node_bundler = "esbuild"
  directory = ".netlify/functions-internal"

# Catch-all to the SSR function generated by TanStack Start
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false