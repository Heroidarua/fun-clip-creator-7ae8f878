[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# ─── Cache: nunca cachear os arquivos que controlam a versão ───
# Sem isso, o Netlify/CDN + navegador podem servir index.html/sw.js
# antigos mesmo após um deploy bem-sucedido, fazendo parecer que
# "as atualizações não passam".
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets com hash no nome podem cachear pra sempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
