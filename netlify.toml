[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  TARGET = "netlify"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  # Bundle the SSR build output with the function
  included_files = ["dist/server/**"]

# Static assets served directly from dist/client; everything else
# falls through to the SSR function via its own `path = "/*"` config.
[[redirects]]
  from = "/_build/*"
  to = "/_build/:splat"
  status = 200

# Catch-all to the SSR function generated by TanStack Start
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false